<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>便签 · smartTrans</title>
  <link rel="stylesheet" href="./note.css">
</head>
<body data-color="yellow">
  <header class="toolbar">
    <span class="title">便签</span>
    <button id="newNote" title="新建便签" aria-label="新建便签">＋</button>
    <select id="color" aria-label="便签颜色" title="便签颜色">
      <option value="yellow">黄色</option><option value="pink">粉色</option><option value="blue">蓝色</option>
      <option value="green">绿色</option><option value="gray">灰色</option>
    </select>
    <button id="pin" aria-pressed="true" title="取消置顶">📌</button>
    <button id="delete" title="删除便签" aria-label="删除便签">×</button>
  </header>
  <nav class="formatbar" aria-label="文字排版">
    <button id="heading" type="button" title="标题 / 正文" aria-label="切换标题">标题</button>
    <button id="bold" type="button" title="加粗 · ⌘B" aria-label="加粗"><span class="format-icon" aria-hidden="true"><strong>B</strong></span></button>
    <button id="underline" type="button" title="下划线 · ⌘U" aria-label="下划线"><span class="format-icon" aria-hidden="true"><u>U</u></span></button>
    <button id="strike" type="button" title="删除线" aria-label="删除线"><span class="format-icon" aria-hidden="true"><s>S</s></span></button>
    <button id="bullets" type="button" title="项目列表" aria-label="项目列表"><span class="format-icon" aria-hidden="true">•</span><span>列表</span></button>
    <button id="numbers" type="button" title="编号列表" aria-label="编号列表"><span class="format-icon" aria-hidden="true">1.</span><span>列表</span></button>
    <button id="tasks" type="button" title="任务列表，点击方框勾选" aria-label="任务列表"><span class="format-icon" aria-hidden="true">☑</span><span>任务</span></button>
  </nav>
  <div id="text" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="便签内容" data-placeholder="写点什么…"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="./vendor/markdown.js"></script>
  <script src="./note.js"></script>
</body>
</html>
